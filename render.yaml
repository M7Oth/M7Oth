# Render.com blueprint: one web service (game + WebSocket server) and a managed PostgreSQL.
services:
  - type: web
    name: freelancer-life-simulator
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fls-db
          property: connectionString
databases:
  - name: fls-db
    plan: basic-256mb
